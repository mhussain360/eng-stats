<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://d3js.org https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data:; connect-src 'self' file: data:">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Engineering Activity Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header text-center">
            <h1>Engineering Activity Dashboard</h1>
        </div>

        <div id="mainContent" style="display: none;">
            <div class="row">
                <div class="col-md-3">
                    <div class="card filter-section">
                        <div class="card-body">
                            <h5 class="card-title">Filters</h5>

                            <div class="mb-3">
                                <label for="developerFilter" class="form-label">Developer Name</label>
                                <select id="developerFilter" class="form-select" multiple>
                                    <!-- Options will be populated dynamically -->
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="gradeFilter" class="form-label">Grade</label>
                                <select id="gradeFilter" class="form-select" multiple>
                                    <!-- Options will be populated dynamically -->
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="teamFilter" class="form-label">Team</label>
                                <select id="teamFilter" class="form-select" multiple>
                                    <!-- Options will be populated dynamically -->
                                </select>
                            </div>

                            <button id="applyFilters" class="btn btn-primary">Apply Filters</button>
                            <button id="resetFilters" class="btn btn-secondary mt-2">Reset Filters</button>

                            <!-- Debug information -->
                            <div id="debugInfo" class="debug-info mt-3"></div>
                        </div>
                    </div>

                    <div class="card chart-type-selector">
                        <div class="card-body">
                            <h5 class="card-title">Chart Type</h5>
                            <select id="chartType" class="form-select">
                                <option value="line">Line Chart</option>
                                <option value="bar">Bar Chart</option>
                                <option value="radar">Radar Chart</option>
                                <option value="polarArea">Polar Area</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="col-md-9">
                    <div class="card visualization-section">
                        <div class="card-body">
                            <h5 class="card-title">Performance Over Time</h5>
                            <div class="chart-container">
                                <canvas id="performanceChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="card developer-comparison">
                        <div class="card-body">
                            <h5 class="card-title">Developer Comparison</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <select id="comparisonType" class="form-select mb-3">
                                        <option value="monthly">Monthly Progress</option>
                                        <option value="total">Total Contribution</option>
                                        <option value="average">Average Monthly Contribution</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <select id="compareMonthSelect" class="form-select mb-3">
                                        <!-- Options will be populated dynamically -->
                                    </select>
                                </div>
                            </div>
                            <div id="comparison-chart-container" class="chart-container">
                                <canvas id="comparisonChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Data Table <span id="recordCount" class="badge bg-secondary ms-2"></span></h5>
                            <div class="table-responsive">
                                <table id="dataTable" class="table table-striped table-hover">
                                    <!-- Table content will be populated dynamically -->
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Commit Descriptions -->
    <div id="commitModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="modalTitle">Commit History</h3>
            <input type="text" id="commitSearch" class="commit-search" placeholder="Search commit descriptions...">
            <div class="table-responsive">
                <table id="commitTable" class="table table-striped table-hover commit-table">
                    <thead>
                        <tr>
                            <th>Commit Description</th>
                            <th>Files Changed</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Commit data will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Load JavaScript modules -->
    <script src="js/utils.js"></script>
    <script src="js/dataProcessor.js"></script>
    <script src="js/chartManager.js"></script>
    <script src="js/filterManager.js"></script>
    <script src="js/tableManager.js"></script>
    <script src="js/commitModal.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
